{% load static i18n %}<!DOCTYPE html>
{% get_current_language as LANGUAGE_CODE %}
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1B1535">
    <title>{% block title %}{% translate "Inicio" %}{% endblock %} · Conjunto Reserva de Madrid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/layout.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">
    <link rel="icon" type="image/svg+xml" href="{% static 'img/logo-reserva-de-madrid.svg' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
    {% include "partials/iconos.html" %}
    {% block body %}{% endblock %}
    <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
