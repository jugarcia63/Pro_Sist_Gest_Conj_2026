{% extends "base.html" %}
{% block title %}Lista de Zonas{% endblock %}
{% block content %}
<div class="contenedor">
    <h2>Zonas Comunes</h2>
    {% for z in zonas %}
        <div class="card">
            <strong>{{ z.nombre }}</strong> - Capacidad: {{ z.capacidad }} - {{ z.descripcion }}
        </div>
    {% endfor %}
    <p><a href="{% url 'lista_reservas' %}" class="btn btn-secundario">Ver reservas</a></p>
</div>
{% endblock %}
