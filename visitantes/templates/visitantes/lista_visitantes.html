{% extends "base.html" %}
{% block title %}Visitantes{% endblock %}
{% block content %}
<div class="contenedor">
    <h1>Visitantes</h1>

    <form method="get" style="display:flex; gap:0.6rem; margin-bottom:1.25rem; max-width:400px;">
        <input type="text" name="buscar" placeholder="Buscar por nombre">
        <button type="submit" class="btn btn-secundario">Buscar</button>
    </form>

    <a href="{% url 'crear_visitante' %}" class="btn btn-primario" style="margin-bottom:1.5rem; display:inline-flex;">+ Nuevo visitante</a>

    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Visita a</th>
                <th>Entrada</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
        {% for v in visitantes %}
            <tr>
                <td>{{ v.nombre }} {{ v.apellidos }}</td>
                <td>{{ v.id_residente_fk }}</td>
                <td>{{ v.fecha_ingreso }}</td>
                <td><a href="{% url 'editar_visitante' v.id_visitante %}">Editar</a></td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
