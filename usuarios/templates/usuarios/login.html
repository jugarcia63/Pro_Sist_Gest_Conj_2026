{% extends "base.html" %}
{% block title %}Iniciar Sesión{% endblock %}
{% block content %}
<div class="contenedor--angosto">
    <div class="card-pagina">
        <h2>Iniciar Sesión</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primario">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
