# Blueprint de Render: crea la base PostgreSQL y el servicio web conectados entre sí.
databases:
  - name: gestion-conjuntos-db
    plan: free
    databaseName: gestion_conjuntos
    user: gestion_conjuntos

services:
  - type: web
    name: gestion-conjuntos
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn GestionDeConjuntos.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.15"
      - key: DATABASE_URL
        fromDatabase:
          name: gestion-conjuntos-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
