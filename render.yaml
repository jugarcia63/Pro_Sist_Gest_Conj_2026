# Blueprint de Render: crea la base PostgreSQL y el servicio web conectados entre sí.
databases:
  - name: gestion-conjuntos-db
    plan: free
    databaseName: gestion_conjuntos
    user: gestion_conjuntos

services:
  - type: web
    name: gestion-conjuntos
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn GestionDeConjuntos.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.15"
      - key: DATABASE_URL
        fromDatabase:
          name: gestion-conjuntos-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ADMIN_USERNAME
        value: juan98
      # La contraseña no va en el repositorio: Render la pide al crear el Blueprint
      - key: ADMIN_PASSWORD
        sync: false
      # Correos de aviso (opcional): clave de API de Brevo y el remitente verificado en Brevo.
      # Si se dejan vacías, la app funciona igual y solo muestra los avisos dentro de la plataforma.
      - key: BREVO_API_KEY
        sync: false
      - key: CORREO_REMITENTE
        sync: false
      # Pon 1 para regenerar los datos de ejemplo con fechas de hoy en el próximo deploy (ver build.sh)
      - key: REFRESCAR_DATOS
        value: "0"
